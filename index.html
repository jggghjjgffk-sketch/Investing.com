<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Investing.com | منصة التداول</title>
    <style>
        body { font-family: sans-serif; background-color: #0b0e11; color: white; margin: 0; padding: 0; text-align: center; }
        .hero { padding: 50px 20px; }
        h1 { color: #00d09c; }
        .pricing { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: #1e2329; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .btn { display: block; background: #00d09c; color: black; padding: 10px; border-radius: 5px; text-decoration: none; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Investing.com</h1>
        <p>المنصة الأسرع والأكثر أماناً لتداول الذهب والعملات.</p>
    </div>

    <div style="height: 400px; padding: 20px;">
        <iframe src="https://www.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=D&theme=dark" width="100%" height="100%"></iframe>
    </div>

    <div class="pricing">
        <div class="card">
            <h3>الباقة الأساسية</h3>
            <p>السعر: 30$</p>
            <p>الربح اليومي: 20%</p>
            <a href="#" class="btn">اشترك الآن</a>
        </div>
        <div class="card">
            <h3>الباقة الذهبية</h3>
            <p>السعر: 80$</p>
            <p>الربح اليومي: 20%</p>
            <a href="#" class="btn">اشترك الآن</a>
        </div>
    </div>

</body>
</html>
