<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Investing.com</title>
    <style>
        body { font-family: sans-serif; background-color: #0b0e11; color: white; margin: 0; }
        .auth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; background: #1e2329; color: white; }
        .btn-main { background: #00d09c; color: black; padding: 15px 40px; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; width: 100%; }
        
        /* إخفاء المنصة عند الفتح */
        #main-app { display: none; padding-bottom: 80px; }
        .page { display: none; }
        .active { display: block; }
        .nav { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 15px; }
    </style>
</head>
<body>

    <div id="login-page" class="auth-container">
        <h1>مرحباً بك في Investing.com</h1>
        <input type="text" placeholder="البريد الإلكتروني">
        <input type="password" placeholder="كلمة المرور">
        <button class="btn-main" onclick="login()">تسجيل الدخول</button>
    </div>

    <div id="main-app">
        <div id="home" class="page active">
            <h2 style="text-align:center; color:#00d09c;">الواجهة الرئيسية</h2>
            <div style="height: 250px;"><iframe src="https://www.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=D&theme=dark" width="100%" height="100%"></iframe></div>
        </div>
        
        <div class="nav">
            <button onclick="showPage('home')">الواجهة</button>
        </div>
    </div>

    <script>
        function login() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
