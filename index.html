<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newmont Pro</title>
    <style>
        body { background-color: #0b0e11; color: white; margin: 0; font-family: sans-serif; }
        .page { display: none; padding: 20px; padding-bottom: 100px; }
        .active { display: block; }
        .navbar { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .btn-nav { background: none; border: none; color: white; cursor: pointer; }
        .card { background: #161a20; padding: 20px; border-radius: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="home" class="page active">
        <h1>الواجهة الرئيسية</h1>
        <div class="card">هنا رسم الذهب البياني</div>
    </div>

    <div id="vip" class="page">
        <h1>باقات VIP</h1>
        <div class="card">VIP 1: 55 USDT</div>
    </div>

    <div id="team" class="page"><h1>الفريق</h1></div>
    <div id="tasks" class="page"><h1>المهام</h1></div>
    <div id="account" class="page"><h1>حسابي</h1></div>

    <div class="navbar">
        <button class="btn-nav" onclick="go('home')">البيت</button>
        <button class="btn-nav" onclick="go('vip')">VIP</button>
        <button class="btn-nav" onclick="go('team')">الفريق</button>
        <button class="btn-nav" onclick="go('tasks')">المهام</button>
        <button class="btn-nav" onclick="go('account')">الحساب</button>
    </div>

    <script>
        function go(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }
    </script>
</body>
</html>
