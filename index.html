<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investing.com | تسجيل الدخول</title>
    <style>
        body { font-family: sans-serif; background-color: #0b0e11; color: white; margin: 0; }
        .auth-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        input { width: 90%; max-width: 400px; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #161a20; color: white; }
        .btn-main { background: #00d09c; color: black; padding: 15px 40px; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; width: 90%; max-width: 400px; margin-top: 10px; }
        .toggle-text { margin-top: 15px; color: #888; cursor: pointer; }
        
        #main-app { display: none; }
        .page { display: none; padding: 20px; padding-bottom: 80px; }
        .active { display: block; }
    </style>
</head>
<body>

    <div id="auth-page" class="auth-box">
        <h1 id="title">تسجيل الدخول</h1>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="btn-main" onclick="accessApp()">دخول</button>
        <p class="toggle-text" id="toggle" onclick="toggleAuth()">ليس لديك حساب؟ إنشاء حساب جديد</p>
    </div>

    <div id="main-app">
        <div id="home" class="page active">
            <h2 style="color:#00d09c; text-align:center;">الواجهة الرئيسية</h2>
            <div style="height: 250px;"><iframe src="https://www.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=D&theme=dark" width="100%" height="100%"></iframe></div>
        </div>
        
        <div style="position:fixed; bottom:0; width:100%; background:#1a1a1a; display:flex; justify-content:space-around; padding:15px;">
            <button onclick="showPage('home')" style="background:none; border:none; color:white;">الواجهة</button>
        </div>
    </div>

    <script>
        function toggleAuth() {
            const title = document.getElementById('title');
            if(title.innerText === "تسجيل الدخول") {
                title.innerText = "إنشاء حساب جديد";
                document.getElementById('toggle').innerText = "لديك حساب بالفعل؟ تسجيل الدخول";
            } else {
                title.innerText = "تسجيل الدخول";
                document.getElementById('toggle').innerText = "ليس لديك حساب؟ إنشاء حساب جديد";
            }
        }

        function accessApp() {
            document.getElementById('auth-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
