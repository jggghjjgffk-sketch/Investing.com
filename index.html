<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investing.com | منصة التداول الذكي</title>
    <style>
        :root {
            --primary-color: #00d09c;
            --dark-bg: #0b0e11;
            --text-color: #ffffff;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--dark-bg); color: var(--text-color); margin: 0; padding: 0; }
        
        /* الناف بار */
        nav { padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary-color); }
        
        /* القسم الرئيسي */
        .hero { text-align: center; padding: 100px 20px; }
        h1 { font-size: 48px; margin-bottom: 20px; }
        p { font-size: 18px; color: #aaa; max-width: 600px; margin: 0 auto 30px; }
        
        .btn { background-color: var(--primary-color); color: #000; padding: 15px 40px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 18px; transition: 0.3s; }
        .btn:hover { background-color: #00b387; }
        
        /* بطاقات الميزات */
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 50px; }
        .card { background: #1e2329; padding: 30px; border-radius: 15px; text-align: center; }
    </style>
</head>
<body>

<nav>
    <div class="logo">Investing.com</div>
    <div>عربي</div>
</nav>

<div class="hero">
    <h1>مستقبل التداول بين يديك</h1>
    <p>حلل، تداول، وانسخ صفقات المحترفين بضغطة زر واحدة. منصة آمنة، سريعة، ومتطورة.</p>
    <a href="#" class="btn">ابدأ رحلة التداول</a>
</div>

<div class="features">
    <div class="card"><h3>تحليل فني دقيق</h3><p>أدوات متطورة لكل الأسواق.</p></div>
    <div class="card"><h3>نسخ الصفقات</h3><p>لا تحتاج لخبرة، انسخ المحترفين.</p></div>
    <div class="card"><h3>حماية عالية</h3><p>تداول بأمان مطلق.</p></div>
</div>

</body>
</html>
