<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newmont Pro</title>
    <style>
        body { font-family: sans-serif; background-color: #0b0e11; color: #ffffff; margin: 0; padding-bottom: 80px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #0b0e11; border-bottom: 1px solid #333; }
        .title { font-weight: bold; font-size: 18px; color: #fff; }
        
        /* تصميم كروت الـ VIP */
        .vip-card { background: #161a20; border: 1px solid #333; border-radius: 15px; padding: 20px; margin: 15px; }
        .vip-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-open { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* ألوان الباقات */
        .blue-btn { background: #3498db; color: white; }
        .yellow-btn { background: #f1c40f; color: black; }
        
        /* القائمة السفلية */
        .navbar { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .nav-item { color: #888; font-size: 12px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <span>🔔</span>
        <div class="title">NEWMONT PRO</div>
        <span>✈️</span>
    </div>

    <div id="vip-section">
        <div class="vip-card" style="border-color: #00d09c;">
            <div class="vip-title"><span>VIP 1</span><span>السعر: 30 USDT</span></div>
            <button class="btn-open blue-btn">فتح المستوى</button>
        </div>
        <div class="vip-card">
            <div class="vip-title"><span>VIP 2</span><span>السعر: 80 USDT</span></div>
            <button class="btn-open yellow-btn">فتح المستوى</button>
        </div>
        <div class="vip-card">
            <div class="vip-title"><span>VIP 3</span><span>السعر: 150 USDT</span></div>
            <button class="btn-open blue-btn">فتح المستوى</button>
        </div>
        <div class="vip-card">
            <div class="vip-title"><span>VIP 4</span><span>السعر: 300 USDT</span></div>
            <button class="btn-open yellow-btn">فتح المستوى</button>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item">👤<br>حسابي</div>
        <div class="nav-item">👥<br>فريق</div>
        <div class="nav-item" style="color: #fff;">💎<br>VIP</div>
        <div class="nav-item">⚙️<br>مهام</div>
        <div class="nav-item">🏠<br>بيت</div>
    </div>

</body>
</html>
