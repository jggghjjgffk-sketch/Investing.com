<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investing.com | الواجهة</title>
    <style>
        body { font-family: sans-serif; background-color: #0b0e11; color: white; margin: 0; padding-bottom: 70px; }
        .header { padding: 20px; text-align: center; color: #00d09c; font-weight: bold; font-size: 20px; border-bottom: 1px solid #333; }
        
        /* الرسم البياني */
        .chart-container { height: 300px; padding: 15px; }
        
        /* قسم العملات */
        .market-section { padding: 20px; }
        .market-card { background: #1e2329; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        
        /* القائمة السفلية */
        .navbar { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .nav-item { color: #888; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header">الواجهة الرئيسية</div>

    <div class="chart-container">
        <iframe src="https://www.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=D&theme=dark" width="100%" height="100%"></iframe>
    </div>

    <div class="market-section">
        <h3 style="color: #00d09c;">تقلبات السوق الحية</h3>
        
        <div class="market-card">
            <span>البتكوين / دولار</span>
            <span style="color: #00ff00;">+2.4% ▲</span>
        </div>
        <div class="market-card">
            <span>اليورو / دولار</span>
            <span style="color: #ff0000;">-0.5% ▼</span>
        </div>
        <div class="market-card">
            <span>الإيثيريوم / دولار</span>
            <span style="color: #00ff00;">+1.2% ▲</span>
        </div>
    </div>

    <div class="navbar">
        <a href="#" class="nav-item">حسابي</a>
        <a href="#" class="nav-item">الفريق</a>
        <a href="#" class="nav-item">VIP</a>
        <a href="#" class="nav-item">مهام</a>
        <a href="#" class="nav-item">الواجهة</a>
    </div>

</body>
</html>
